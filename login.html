<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <h4 class="fw-bold mb-1">Login</h4>
                        <p class="text-secondary mb-4">Masuk untuk mengelola data mahasiswa.</p>

                        <!-- Pesan error (disembunyikan sampai dibutuhkan) -->
                        <div id="pesanError" class="alert alert-danger d-none" role="alert"></div>

                        <form id="formLogin">

                            <div class="mb-3">
                                <label class="form-label" for="username">Username</label>
                                <input type="text" id="username" class="form-control" placeholder="Masukkan username"
                                    required autofocus>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="password">Password</label>
                                <input type="password" id="password" class="form-control"
                                    placeholder="Masukkan password" required>
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox" id="tampilPassword" class="form-check-input">
                                <label class="form-check-label" for="tampilPassword">Tampilkan password</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Masuk</button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>


    <script src="js/login.js">

    </script>



</body>

</html>
